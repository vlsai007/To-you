<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Do you love me?</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff8fa;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .teddy {
      width: 260px;
      max-width: 80vw;
      height: auto;
      border-radius: 20px;
      margin-bottom: 25px;
      object-fit: contain;
    }

    .video {
      width: 260px;
      max-width: 80vw;
      border-radius: 20px;
      margin-bottom: 25px;
      display: none;
    }

    h1 {
      font-size: 30px;
      color: #5b4146;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      align-items: center;
    }

    button {
      border: none;
      padding: 13px 28px;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background: #ff8fab;
      color: white;
    }

    #noBtn {
      background: #eee;
      color: #555;
    }

    button:hover {
      transform: scale(1.08);
    }

    .message {
      display: none;
      font-size: 25px;
      color: #ff6f91;
      margin-top: 20px;
      line-height: 1.5;
    }

    .heart {
      position: fixed;
      font-size: 25px;
      animation: float 3s linear forwards;
      pointer-events: none;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(-100vh) scale(1.5);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- NEW TEDDY IMAGE -->
    <img
      id="teddyImage"
      class="teddy"
      src="teddy1.jpeg"
      alt="Cute teddy"
    >

    <!-- NEW TEDDY VIDEO -->
    <video
      id="teddyVideo"
      class="video"
      autoplay
      muted
      loop
      playsinline
    >
      <source src="teddy2.mp4" type="video/mp4">
    </video>

    <h1 id="question">Do you love me? 💗</h1>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 😭</button>
    </div>

    <div class="message" id="message">
      I knew it! 🥹💗<br>
      You are the cutest person ever! 🧸💕
    </div>

  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    const question = document.getElementById("question");
    const buttons = document.getElementById("buttons");
    const message = document.getElementById("message");

    const teddyImage = document.getElementById("teddyImage");
    const teddyVideo = document.getElementById("teddyVideo");

    // YES BUTTON
    yesBtn.addEventListener("click", () => {

      question.innerHTML = "YAYYY! I LOVE YOU TOO! 💗🥹";

      buttons.style.display = "none";

      teddyImage.style.display = "none";
      teddyVideo.style.display = "block";

      message.style.display = "block";

      createHearts();

      teddyVideo.play().catch(() => {});
    });


    // NO BUTTON
    noBtn.addEventListener("mouseover", moveNoButton);

    noBtn.addEventListener("touchstart", moveNoButton);

    function moveNoButton() {

      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }


    // FLOATING HEARTS
    function createHearts() {

      for (let i = 0; i < 30; i++) {

        setTimeout(() => {

          const heart = document.createElement("div");

          heart.className = "heart";
          heart.innerHTML = "💗";

          heart.style.left =
            Math.random() * window.innerWidth + "px";

          heart.style.top =
            window.innerHeight + "px";

          heart.style.animationDuration =
            (2 + Math.random() * 3) + "s";

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 5000);

        }, i * 100);
      }
    }
  </script>

</body>
</html>
