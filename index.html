<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do you love me?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #ffe6eb;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 320px;
      position: relative;
    }

    .gif-container {
      width: 100%;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .gif-container img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }

    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 25px;
    }

    .btn-group {
      position: relative;
      width: 100%;
      height: 50px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    button {
      padding: 10px 25px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #yesBtn {
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
    }

    #noBtn {
      background-color: #ff758f;
      color: white;
      position: absolute;
      left: 150px;
    }

    .loader {
      display: none;
      width: 50px;
      height: 50px;
      background-color: #ff4d6d;
      margin: 20px auto;
      clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
      transform-origin: center;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); }
      100% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <div class="card" id="questionCard">
    <div class="gif-container">
      <img id="mainGif" src="https://media1.tenor.com/m/X4xQ8fWnLhAAAAAC/milk-and-mocha-bear.gif" alt="Cute Bears">
    </div>
    <h1 id="title">Do you love me?</h1>
    <div class="btn-group">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>
    <div id="heartLoader" class="loader"></div>
  </div>

  <script>
    const questionContainer = document.getElementById('questionCard');
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const mainGif = document.getElementById('mainGif');
    const title = document.getElementById('title');
    const btnGroup = document.querySelector('.btn-group');
    const heartLoader = document.getElementById('heartLoader');

    noBtn.addEventListener('mouseover', () => {
      const cardRect = questionContainer.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;

      const newX = Math.floor(Math.random() * maxX);
      const newY = Math.floor(Math.random() * maxY);

      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    });

    yesBtn.addEventListener('click', () => {
      btnGroup.style.display = 'none';
      mainGif.style.display = 'none';
      title.style.display = 'none';
      
      heartLoader.style.display = 'block';

      setTimeout(() => {
        heartLoader.style.display = 'none';
        
        mainGif.src = "https://media1.tenor.com/m/alH1S7ApyC8AAAAC/milk-and-mocha-hug.gif";
        mainGif.style.display = 'block';
        
        title.innerText = "I knew it ❤️!";
        title.style.display = 'block';
      }, 3000);
    });
  </script>
</body>
</html>
